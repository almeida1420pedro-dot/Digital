    <script>
      // Ignore WebSocket disconnect errors in AI Studio iframe environment where HMR is disabled
      window.addEventListener('error', function(event) {
        if (event && (event.message?.includes('WebSocket') || event.filename?.includes('@vite/client'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (String(event.reason.message || event.reason).includes('WebSocket'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
